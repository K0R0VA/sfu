<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust WebRTC SFU Room</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 20px; 
            background: #121214; color: #e1e1e6; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; 
        }
        h2 { margin-bottom: 5px; color: #00ea91; }
        #roomInfo { margin-bottom: 20px; color: #8f8f9d; font-size: 14px; }
        
        /* Кнопка управления */
        #startBtn { 
            padding: 12px 24px; font-size: 16px; font-weight: 600;
            cursor: pointer; border: none; border-radius: 6px; 
            background: #00ea91; color: #0a0a0c;
            transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(0, 234, 145, 0.2);
        }
        #startBtn:hover { background: #00cc7e; transform: translateY(-1px); }
        #startBtn:disabled { background: #29292e; color: #737380; cursor: not-allowed; box-shadow: none; }

        /* Динамическая сетка для видео участников */
        #videoGrid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 20px; width: 100%; max-width: 1200px; 
            margin-top: 30px; 
        }

        /* Контейнер для каждого участника */
        .video-container { 
            position: relative; background: #1c1c1f; 
            border-radius: 12px; overflow: hidden; 
            aspect-ratio: 16/9; border: 2px solid #29292e;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .video-container.local { border-color: #00ea91; }
        
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Плашка с именем пользователя */
        .peer-label { 
            position: absolute; bottom: 10px; left: 10px; 
            background: rgba(10, 10, 12, 0.75); padding: 4px 12px; 
            border-radius: 4px; font-size: 12px; font-weight: 500;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <h2>Rust WebRTC SFU Room</h2>
    <div id="roomInfo">Подключение к медиа-серверу на акторах</div>
    
    <button id="startBtn">Войти в комнату</button>

    <!-- Сюда JS будет динамически добавлять блоки с видео -->
    <div id="videoGrid"></div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const videoGrid = document.getElementById('videoGrid');

        // Генерируем случайный ID для себя при входе
        startBtn.onclick = async () => {
            startBtn.disabled = true;
            // 1. Подключаемся к Rust серверу
            let ws = create_ws();
            const pc = new RTCPeerConnection({ iceServers: [
                {
                    urls: ["stun:stun.l.google.com:19302"]
                },
                {
                    urls: ["turn:192.168.0.106:3478"],
                    username: "admin",               
                    credential: "secretpassword"
                }
            ] });
            let peer_id;
            let stream_id;
            ws.onopen = async () => {
                console.log(`🟢 WebSocket соединен`);
            };
            pc.ontrack = ({track, streams}) => {
                console.log("🎯 [OnTrack] Прилетел медиа-трек от сервера:", event);
                
                // Ищем среди прилетевших стримов тот, который принадлежит соседу
                // (то есть его ID не равен ID нашей собственной локальной камеры)
                const remoteStream = streams[0];

                const rawId = remoteStream.id; 
                if (rawId != stream_id) {
                    console.log("Поток соседа найден:", remoteStream);
                    const remotePeerId = rawId.startsWith("stream_") ? rawId.replace("stream_", "") : rawId;
                    console.log(`🎯 Рендерим окно для пользователя: ${remotePeerId}`);
                    createVideoElement(remotePeerId, remoteStream, false);
                }
            };
            let makingOffer = false;

// 🔥 1. ВСТРОЕННЫЙ ДАТЧИК ИЗ MDN (Срабатывает сам, когда мы добавляем трансиверы!)
            pc.onnegotiationneeded = async () => {
                try {
                    makingOffer = true;
                    console.log("🔄 [MDN Паттерн] Датчик onnegotiationneeded сработал! Создаем Offer автоматически...");
                    
                    // setLocalDescription() без аргументов сам создаст идеальный Оффер
                    await pc.setLocalDescription(); 
                    
                    console.log("📤 Отправляем автоматический SDP Offer на сервер...");
                    ws.send(JSON.stringify(pc.localDescription));
                } catch (err) {
                    console.error("Ошибка в паттерне перепереговоров:", err);
                } finally {
                    makingOffer = false;
                }
            };
            ws.onmessage = async (event) => {
                const message = JSON.parse(event.data);
                if (message.type == 'welcome') {
                    peer_id = message.assigned_peer_id;
                    console.log(`🟢 Мой ID: ${peer_id}`);
                    document.getElementById('roomInfo').innerText = `Вы вошли как: ${peer_id}`;
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    const videoTrack = stream.getVideoTracks()[0];
                    stream_id = videoTrack.id;
                    stream.getTracks().forEach(track => {
                        pc.addTrack(track, stream);
                    })
                    createVideoElement(peer_id, stream, true);
                }
                else if (message.type === 'peer_joined') {
                    console.log("🎯 [OnTrack] Прилетел новый пользователь", message);
                    pc.addTransceiver('video', { direction: 'recvonly' }); 
                    return;
                } 
                else if (message.type === 'answer') {
                    if (pc.signalingState === "have-local-offer") {
                        await pc.setRemoteDescription(new RTCSessionDescription(message));
                        console.log("🟢 Стейт-машина успешно переведена в stable");
                    }
                }
            };
            ws.onclose = () => {
                console.log("🔴 Соединение закрыто");
                document.getElementById('roomInfo').innerText = "Соединение разорвано";
                videoGrid.innerHTML = "";
                startBtn.disabled = false;
            };
        };

        function create_ws() {
            const serverIP = window.location.hostname; 
            if (serverIP == 'localhost') {
                return new WebSocket(`ws://${serverIP}:8080/ws`)
            } else {
                return new WebSocket(`wss://${serverIP}/ws`)
            }
        }

        // Функция динамического создания HTML-карточки для видео
        function createVideoElement(peerId, stream, isLocal) {
            let container = document.getElementById(`container_${peerId}`);
            if (container) {
                const video = container.querySelector('video');
                video.srcObject = stream;
                video.play().catch(e => console.error("Ошибка автоплея:", e));
                return;
            }
            container = document.createElement('div');
            container.id = `container_${peerId}`;
            container.className = `video-container ${isLocal ? 'local' : ''}`;

            const video = document.createElement('video');
            video.autoplay = true;
            video.playsInline = true;

            // 🔥 КРИТИЧЕСКИЙ ФИКС: Сначала глушим ВСЕ видео (и локальное, и удаленное), 
            // чтобы обойти Autoplay Policy браузера на 100%. Картинка точно пойдет!
            video.muted = true; 

            video.srcObject = stream;

            const label = document.createElement('div');
            label.className = 'peer-label';
            label.innerText = (isLocal ? 'Вы: ' : 'Сосед: ') + peerId;

            container.appendChild(video);
            container.appendChild(label);
            videoGrid.appendChild(container);
            video.play();
        }
    </script>
</body>
</html>
